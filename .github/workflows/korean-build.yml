name: Korean Windows Installer

on:
  push:
    branches:
      - 'ko-build-*'
    paths:
      - '.github/workflows/korean-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Korean build branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify and apply Korean source patch
        shell: pwsh
        run: |
          python korean-build/apply_korean.py . --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python korean-build/apply_korean.py .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Inject version
        run: >-
          node -e "const fs=require('fs'); for(const file of ['package.json','src-tauri/tauri.conf.json']) {const data=JSON.parse(fs.readFileSync(file,'utf8'));data.version='1.9.8';fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');}"
      - name: Verify TypeScript, lint and tests
        run: pnpm verify
      - name: Verify Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Set separate Korean app identity
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(f,'utf8'));c.productName='Multi-AI Chat Desktop KO';c.identifier='com.tedh.multiaichat.ko';c.app.windows[0].title=c.productName;c.bundle.windows.nsis.languages=['Korean','English'];fs.writeFileSync(f,JSON.stringify(c,null,2)+'\n');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows installer
        run: pnpm tauri build --bundles nsis
      - name: Upload verified installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: korean-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
